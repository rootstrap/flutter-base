plugins {
    id "com.android.application"
    // The Flutter Gradle Plugin must be applied after the Android and Kotlin Gradle plugins.
    id "dev.flutter.flutter-gradle-plugin"
}

/**
 * Project identity and SDK levels live in android/build.properties.
 * The identity keys are written by the project initializer (`melos run init`).
 */
def buildProperties = new Properties()
def buildPropertiesFile = rootProject.file('build.properties')
if (buildPropertiesFile.exists()) {
    buildPropertiesFile.withReader('UTF-8') { reader ->
        buildProperties.load(reader)
    }
}

def requiredBuildProperty = { String key ->
    def value = buildProperties.getProperty(key)
    if (value == null || value.trim().isEmpty()) {
        throw new GradleException("Missing '$key' in android/build.properties")
    }
    return value.trim()
}

/**
 * Declare the env vars here
 * **/
def dartEnvironmentVariables = [
        API_KEY: null
]

if (project.hasProperty('dart-defines')) {
    dartEnvironmentVariables = dartEnvironmentVariables + project.property('dart-defines')
            .split(',')
            .collectEntries { entry ->
                def pair = new String(entry.decodeBase64(), 'UTF-8').split('=')
                [(pair.first()): pair.last()]
            }
}

def keystoreProperties = new Properties()
def keystorePropertiesFile = rootProject.file('key.properties')
def releaseSigningConfigured = keystorePropertiesFile.exists()
if (releaseSigningConfigured) {
    keystorePropertiesFile.withInputStream { keystoreProperties.load(it) }
}

android {
    namespace = requiredBuildProperty('flutter.namespace')
    compileSdk = requiredBuildProperty('flutter.compileSdkVersion').toInteger()
    ndkVersion = flutter.ndkVersion

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }

    defaultConfig {
        applicationId = requiredBuildProperty('flutter.applicationId')
        minSdk = requiredBuildProperty('flutter.minSdkVersion').toInteger()
        targetSdk = requiredBuildProperty('flutter.targetSdkVersion').toInteger()
        // Uses the version from pubspec.yaml.
        versionCode = flutter.versionCode
        versionName = flutter.versionName
        // Added to (not replacing) the placeholders the Flutter plugin sets.
        manifestPlaceholders.put('appLabel', requiredBuildProperty('flutter.appName'))
    }

    signingConfigs {
        if (releaseSigningConfigured) {
            release {
                keyAlias = keystoreProperties['keyAlias']
                keyPassword = keystoreProperties['keyPassword']
                storeFile = keystoreProperties['storeFile'] ? file(keystoreProperties['storeFile']) : null
                storePassword = keystoreProperties['storePassword']
            }
        }
    }

    buildTypes {
        release {
            // Signed with android/key.properties when present. Without it, the debug keys are
            // used so `flutter build apk --release` works in the template and in CI.
            signingConfig = releaseSigningConfigured ? signingConfigs.release : signingConfigs.debug
        }
        debug {
            applicationIdSuffix = ".debug"
        }
    }
}

kotlin {
    compilerOptions {
        jvmTarget = org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_17
    }
}

flutter {
    source = '../..'
}
