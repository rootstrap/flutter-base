name: app
description: A new Flutter project.

resolution: workspace

# The following line prevents the package from being accidentally published to
# pub.dev using `flutter pub publish`. This is preferred for private packages.
publish_to: "none" # Remove this line if you wish to publish to pub.dev

# The following defines the version and build number for your application.
# A version number is three numbers separated by dots, like 1.2.43
# followed by an optional build number separated by a +.
# Both the version and the builder number may be overridden in flutter
# build by specifying --build-name and --build-number, respectively.
# In Android, build-name is used as versionName while build-number used as versionCode.
# Read more about Android versioning at https://developer.android.com/studio/publish/versioning
# In iOS, build-name is used as CFBundleShortVersionString while build-number used as CFBundleVersion.
# Read more about iOS versioning at
# https://developer.apple.com/library/archive/documentation/General/Reference/InfoPlistKeyReference/Articles/CoreFoundationKeys.html
version: 1.0.0+1

environment:
  sdk: ^3.13.0
  flutter: ">=3.47.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_svg: ^2.3.0
  shared_preferences: ^2.5.5
  intl: ^0.20.3
  intl_utils: ^2.8.16
  cupertino_icons: ^1.0.9
  dio: ^5.11.1
  async: ^2.13.1
  flutter_bloc: ^9.1.1
  get_it: ^9.3.0
  package_info_plus: ^10.2.1
  permission_handler: ^13.0.2
  universal_html: ^2.3.0
  go_router: ^18.0.1
  equatable: ^3.0.0
  firebase_core: ^4.15.0
  flutter_localizations:
    sdk: flutter
  domain:
    path: ../modules/domain
  common:
    path: ../modules/common
  data:
    path: ../modules/data

  flutter_dotenv: ^6.0.1
  flutter_web_plugins:
    sdk: flutter
  app_links: ^7.2.1
  gap: ^3.0.1

dev_dependencies:
  bloc_test: ^10.0.0
  build_runner: ^2.16.1
  flutter_gen: ^5.15.0
  flutter_test:
    sdk: flutter
  mocktail: ^1.0.5
  flutter_lints: ^6.0.0

flutter_intl:
  enabled: true # Required. Must be set to true to activate the package. Default: false
  main_locale: en # Optional. Sets the main locale used for generating localization files. Provided value should consist of language code and optional script and country codes separated with underscore (e.g. 'en', 'en_GB', 'zh_Hans', 'zh_Hans_CN'). Default: en
  arb_dir: lib/presentation/resources/locale # Optional. Sets the directory of your ARB resource files. Provided value should be a valid path on your system. Default: lib/l10n
  output_dir: lib/presentation/resources/locale/generated # Optional. Sets the directory of generated localization files. Provided value should be a valid path on your system. Default: lib/generated

flutter:
  generate: true
  uses-material-design: true
  # Remove example assets.
  assets:
    - assets/images/
    - env/
  fonts:
    - family: Roboto Black
      fonts:
        - asset: fonts/Roboto-Black.ttf
        - asset: fonts/Roboto-BlackItalic.ttf
          style: italic
    - family: Roboto Heavy
      fonts:
        - asset: fonts/Roboto-Bold.ttf
        - asset: fonts/Roboto-BoldItalic.ttf
          style: italic
    - family: Roboto Medium
      fonts:
        - asset: fonts/Roboto-Medium.ttf
        - asset: fonts/Roboto-MediumItalic.ttf
          style: italic
    - family: Roboto Light
      fonts:
        - asset: fonts/Roboto-Light.ttf
        - asset: fonts/Roboto-LightItalic.ttf
          style: italic
    - family: Roboto Regular
      fonts:
        - asset: fonts/Roboto-Regular.ttf
    - family: Roboto Italic
      fonts:
        - asset: fonts/Roboto-Italic.ttf
